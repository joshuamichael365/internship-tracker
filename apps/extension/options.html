<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, sans-serif; padding: 24px; max-width: 480px; }
      label { display: block; font-size: 13px; font-weight: 600; margin-top: 14px; }
      input { width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
      button { margin-top: 16px; background: #0071e3; color: #fff; border: 0; padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; }
      #status { font-size: 13px; color: #34c759; margin-left: 10px; }
    </style>
  </head>
  <body>
    <h2>Internship Tracker Assist</h2>
    <label>App URL <input id="appUrl" placeholder="http://localhost:3000" /></label>
    <label>Extension token <input id="token" type="password" placeholder="EXTENSION_TOKEN from the app's env" /></label>
    <button id="save">Save</button><span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
